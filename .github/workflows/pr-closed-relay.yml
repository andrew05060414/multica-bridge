name: Multica PR closed relay

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label supplied by the calling repository
        required: false
        type: string
        default: ubuntu-latest

permissions: {}

jobs:
  relay:
    name: Relay closed pull request
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Validate webhook configuration
        env:
          WEBHOOK_URL: ${{ secrets.MULTICA_PR_CLOSED_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$WEBHOOK_URL" ]]; then
            echo "::error::MULTICA_PR_CLOSED_WEBHOOK_URL is not configured"
            exit 1
          fi

      - name: Build event payload
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          payload_file="$RUNNER_TEMP/multica-pr-closed.json"

          jq -e '.pull_request.number and (.action == "closed")' "$GITHUB_EVENT_PATH" >/dev/null
          jq \
            --arg action "pr_closed" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            ' {
                action: $action,
                repository: $repository,
                pull_request: {
                  number: .pull_request.number,
                  title: .pull_request.title,
                  state: .pull_request.state,
                  merged: .pull_request.merged,
                  merge_commit_sha: .pull_request.merge_commit_sha,
                  base_ref: .pull_request.base.ref,
                  head_ref: .pull_request.head.ref,
                  head_sha: .pull_request.head.sha,
                  html_url: .pull_request.html_url,
                  closed_at: .pull_request.closed_at
                },
                sender: {
                  login: (.sender.login // null)
                },
                delivery_id: ($repository + ":pr:" + (.pull_request.number | tostring) + ":closed"),
                workflow: {
                  ref: $workflow_ref,
                  run_id: ($run_id | tonumber),
                  run_attempt: ($run_attempt | tonumber)
                }
              }' \
            "$GITHUB_EVENT_PATH" > "$payload_file"

          echo "payload_file=$payload_file" >> "$GITHUB_ENV"

      - name: Send event to Multica
        env:
          MULTICA_PR_CLOSED_WEBHOOK_URL: ${{ secrets.MULTICA_PR_CLOSED_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 60 \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "@$payload_file" \
            "$MULTICA_PR_CLOSED_WEBHOOK_URL"
